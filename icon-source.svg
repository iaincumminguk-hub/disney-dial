<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- gauge arc -->
  <path d="M 116,300 A 140,140 0 0 1 396,300" fill="none" stroke="url(#arc)" stroke-width="40" stroke-linecap="round" />

  <!-- needle, tilted toward "going" -->
  <g transform="rotate(28 256 300)">
    <line x1="256" y1="300" x2="256" y2="185" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  </g>
  <circle cx="256" cy="300" r="24" fill="#ffffff" />
  <circle cx="256" cy="300" r="24" fill="none" stroke="#4338ca" stroke-width="6" />

  <!-- sparkle accent -->
  <g transform="translate(388,140) scale(3.6)" fill="#fde68a">
    <path d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z" />
  </g>
</svg>
